<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" fill="none" width="800" height="480">
  <defs>
    <linearGradient id="facBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  <rect width="800" height="480" rx="20" fill="url(#facBg)" />

  <!-- Cleanroom Facility Grid -->
  <g transform="translate(40, 40)">
    <!-- Header Text -->
    <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#FFFFFF">1,650 m&#178; Precision Manufacturing Floor &#8226; Jinjiang Campus</text>
    <text x="0" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" fill="#94A3B8">ISO 9001:2015 &amp; SEDEX SMETA Audited Light-Industrial Facility</text>

    <!-- Zone 1: CNC Tooling -->
    <g transform="translate(0, 70)">
      <rect width="220" height="150" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
      <text x="20" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="15" fill="#38BDF8">01. CNC Tooling Center</text>
      <text x="20" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94A3B8">&#8226; 4 High-speed engraving CNCs</text>
      <text x="20" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94A3B8">&#8226; 0.18mm line precision</text>
      <text x="20" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94A3B8">&#8226; 3–5 day rapid mold tooling</text>
      <text x="20" y="125" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#10B981">100% IN-HOUSE</text>
    </g>

    <!-- Zone 2: Automated Micro-Injection -->
    <g transform="translate(250, 70)">
      <rect width="220" height="150" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
      <text x="20" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="15" fill="#38BDF8">02. Micro-Injection Floor</text>
      <text x="20" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94A3B8">&#8226; 20+ Multi-color dispensers</text>
      <text x="20" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94A3B8">&#8226; 8–12 color layered drop-dispensing</text>
      <text x="20" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94A3B8">&#8226; 30,000+ daily unit output</text>
      <text x="20" y="125" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#10B981">100% IN-HOUSE</text>
    </g>

    <!-- Zone 3: Die-Casting & Molding -->
    <g transform="translate(500, 70)">
      <rect width="220" height="150" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
      <text x="20" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="15" fill="#38BDF8">03. Die-Casting Press</text>
      <text x="20" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94A3B8">&#8226; LK high-pressure casting</text>
      <text x="20" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94A3B8">&#8226; Zinc alloy 3D medals &amp; frames</text>
      <text x="20" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94A3B8">&#8226; Vibratory stone de-burring</text>
      <text x="20" y="125" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#10B981">100% IN-HOUSE</text>
    </g>

    <!-- Zone 4: Cleanroom Plush Sewing -->
    <g transform="translate(0, 240)">
      <rect width="220" height="150" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
      <text x="20" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="15" fill="#F472B6">04. Plush &amp; Mascot Room</text>
      <text x="20" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94A3B8">&#8226; Computer embroidery machines</text>
      <text x="20" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94A3B8">&#8226; Automated fiber blowers</text>
      <text x="20" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94A3B8">&#8226; EN71 safety needle scanner</text>
      <text x="20" y="125" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#10B981">100% IN-HOUSE</text>
    </g>

    <!-- Zone 5: QC & Tensile Lab -->
    <g transform="translate(250, 240)">
      <rect width="220" height="150" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
      <text x="20" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="15" fill="#10B981">05. QC &amp; Tensile Lab</text>
      <text x="20" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94A3B8">&#8226; 15kg rivet pull test bench</text>
      <text x="20" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94A3B8">&#8226; 100% piece-by-piece inspection</text>
      <text x="20" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94A3B8">&#8226; Strict AQL 1.5 standard</text>
      <text x="20" y="125" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#10B981">100% IN-HOUSE</text>
    </g>

    <!-- Zone 6: Eco Plating Park -->
    <g transform="translate(500, 240)">
      <rect width="220" height="150" rx="12" fill="#0F172A" stroke="#0284C7" stroke-width="1.5" />
      <text x="20" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="15" fill="#38BDF8">06. Industrial Plating Park</text>
      <text x="20" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94A3B8">&#8226; Gold, chrome, antique plating</text>
      <text x="20" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94A3B8">&#8226; Central wastewater treatment</text>
      <text x="20" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94A3B8">&#8226; 48h salt spray anti-tarnish</text>
      <text x="20" y="125" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#38BDF8">CERTIFIED PARK FACILITY</text>

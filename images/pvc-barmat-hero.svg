<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none" width="600" height="600">
  <defs>
    <radialGradient id="pvcBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </radialGradient>
    <filter id="pvcShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
  </defs>

  <rect width="600" height="600" rx="24" fill="url(#pvcBg)" />

  <!-- Heavy-Duty PVC Bar Mat (ST Crafts Benchmark) -->
  <g transform="translate(60, 100)" filter="url(#pvcShadow)">
    <rect width="480" height="200" rx="14" fill="#0F172A" stroke="#334155" stroke-width="4" />
    <!-- Spill prongs / nubs matrix -->
    <g fill="#1E293B">
      <circle cx="40" cy="40" r="5" /><circle cx="70" cy="40" r="5" /><circle cx="100" cy="40" r="5" /><circle cx="130" cy="40" r="5" /><circle cx="160" cy="40" r="5" />
      <circle cx="40" cy="70" r="5" /><circle cx="70" cy="70" r="5" /><circle cx="100" cy="70" r="5" /><circle cx="130" cy="70" r="5" /><circle cx="160" cy="70" r="5" />
      <circle cx="40" cy="100" r="5" /><circle cx="70" cy="100" r="5" /><circle cx="100" cy="100" r="5" /><circle cx="130" cy="100" r="5" /><circle cx="160" cy="100" r="5" />
      <circle cx="40" cy="130" r="5" /><circle cx="70" cy="130" r="5" /><circle cx="100" cy="130" r="5" /><circle cx="130" cy="130" r="5" /><circle cx="160" cy="130" r="5" />
      <circle cx="40" cy="160" r="5" /><circle cx="70" cy="160" r="5" /><circle cx="100" cy="160" r="5" /><circle cx="130" cy="160" r="5" /><circle cx="160" cy="160" r="5" />
      <!-- Right Side Prongs -->
      <circle cx="320" cy="40" r="5" /><circle cx="350" cy="40" r="5" /><circle cx="380" cy="40" r="5" /><circle cx="410" cy="40" r="5" /><circle cx="440" cy="40" r="5" />
      <circle cx="320" cy="70" r="5" /><circle cx="350" cy="70" r="5" /><circle cx="380" cy="70" r="5" /><circle cx="410" cy="70" r="5" /><circle cx="440" cy="70" r="5" />
      <circle cx="320" cy="100" r="5" /><circle cx="350" cy="100" r="5" /><circle cx="380" cy="100" r="5" /><circle cx="410" cy="100" r="5" /><circle cx="440" cy="100" r="5" />
      <circle cx="320" cy="130" r="5" /><circle cx="350" cy="130" r="5" /><circle cx="380" cy="130" r="5" /><circle cx="410" cy="130" r="5" /><circle cx="440" cy="130" r="5" />
      <circle cx="320" cy="160" r="5" /><circle cx="350" cy="160" r="5" /><circle cx="380" cy="160" r="5" /><circle cx="410" cy="160" r="5" /><circle cx="440" cy="160" r="5" />
    </g>
    <!-- Center 3D Micro-Injected Brand Pad -->
    <rect x="180" y="30" width="120" height="140" rx="10" fill="#00BFFF" />
    <text x="240" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="20" fill="#0F172A" text-anchor="middle">BAR MAT</text>
    <text x="240" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.1em">10MM SPILL RUNNER</text>
    <text x="240" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#0F172A" text-anchor="middle">ANTI-SLIP PVC</text>
  </g>

  <!-- 3D Soft PVC Coaster (Bottom Left) -->
  <g transform="translate(80, 340)" filter="url(#pvcShadow)">
    <circle cx="90" cy="90" r="80" fill="#FF5A36" stroke="#C2410C" stroke-width="4" />
    <circle cx="90" cy="90" r="68" fill="#FFFFFF" />
    <circle cx="90" cy="90" r="56" fill="#F8FAFC" />
    <text x="90" y="88" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="14" fill="#0F172A" text-anchor="middle">PVC COASTER</text>
    <text x="90" y="106" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#EA580C" text-anchor="middle">HEAT RESISTANT 120°C</text>
  </g>

  <!-- PVC Luggage Tag with Clear Strap (Bottom Right) -->
  <g transform="translate(320, 330)" filter="url(#pvcShadow)">
    <rect width="180" height="220" rx="14" fill="#0077B6" stroke="#023E8A" stroke-width="3" />
    <!-- Clear Strap Loop -->
    <path d="M 90 -20 C 120 -20 120 15 100 15 L 80 15 C 60 15 60 -20 90 -20 Z" fill="none" stroke="#E2E8F0" stroke-width="8" />
    <rect x="80" y="10" width="20" height="8" rx="4" fill="#0F172A" />
    <!-- ID Window Card -->
    <rect x="20" y="40" width="140" height="150" rx="8" fill="#FFFFFF" />
    <rect x="35" y="60" width="110" height="8" rx="2" fill="#E2E8F0" />
    <rect x="35" y="80" width="90" height="8" rx="2" fill="#E2E8F0" />
    <rect x="35" y="100" width="100" height="8" rx="2" fill="#E2E8F0" />
    <text x="90" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#0077B6" text-anchor="middle">LUGGAGE TAG</text>
    <text x="90" y="168" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10" fill="#64748B" text-anchor="middle">TRAVEL AIRLINES</text>
  </g>
</svg>

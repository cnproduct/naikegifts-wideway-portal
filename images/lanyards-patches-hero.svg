<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none" width="600" height="600">
  <defs>
    <radialGradient id="lanBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </radialGradient>
    <filter id="lanShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
  </defs>

  <rect width="600" height="600" rx="24" fill="url(#lanBg)" />

  <!-- Sublimation Lanyard Loop -->
  <g transform="translate(140, 40)" filter="url(#lanShadow)">
    <path d="M 0 0 C 0 200 120 220 120 340 L 140 340 C 140 220 20 200 20 0 Z" fill="#00BFFF" />
    <path d="M 120 0 C 120 200 130 220 130 340 L 150 340 C 150 220 140 200 140 0 Z" fill="#F556A0" />
    <text transform="rotate(85 60 180)" x="60" y="180" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="12" fill="#0F172A" letter-spacing="0.16em">DEVCONF 2026 &#8226; ALL ACCESS</text>
    
    <!-- Metal Lobster Claw & Safety Breakaway -->
    <rect x="110" y="340" width="40" height="16" rx="4" fill="#334155" />
    <ellipse cx="130" cy="370" rx="14" ry="20" fill="none" stroke="#94A3B8" stroke-width="6" />
    <path d="M 125 385 L 135 385 L 135 410 L 125 410 Z" fill="#64748B" />
  </g>

  <!-- Embroidered Tactical Patch with Merrowed Border (Right) -->
  <g transform="translate(340, 160)" filter="url(#lanShadow)">
    <!-- Merrowed Border Shield -->
    <path d="M 20 20 L 180 20 C 180 120 150 180 100 220 C 50 180 20 120 20 20 Z" fill="#15803D" stroke="#166534" stroke-width="8" stroke-dasharray="8 4" />
    <path d="M 30 30 L 170 30 C 170 115 145 170 100 205 C 55 170 30 115 30 30 Z" fill="#14532D" />
    <!-- Embroidered Insignia -->
    <polygon points="100,60 108,80 130,80 112,95 118,115 100,102 82,115 88,95 70,80 92,80" fill="#FEF08A" stroke="#CA8A04" stroke-width="2" />
    <text x="100" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="13" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.1em">EXPEDITION</text>
    <text x="100" y="170" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10" fill="#86EFAC" text-anchor="middle" letter-spacing="0.12em">VELCRO BACKING</text>
  </g>

  <!-- Silicone Debossed Wristband (Bottom Left) -->
  <g transform="translate(80, 420)" filter="url(#lanShadow)">
    <ellipse cx="140" cy="50" rx="120" ry="35" fill="none" stroke="#FF5A36" stroke-width="24" />
    <ellipse cx="140" cy="50" rx="120" ry="35" fill="none" stroke="#C2410C" stroke-width="4" stroke-dasharray="10 6" />
    <text x="140" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="13" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.14em">100% MEDICAL SILICONE</text>
  </g>

  <!-- Tag Banner -->
  <rect x="40" y="40" width="220" height="34" rx="17" fill="#0B1120" />
  <text x="150" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#00BFFF" text-anchor="middle">LANYARDS, WRISTBANDS &amp; PATCHES</text>
</svg>

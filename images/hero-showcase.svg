<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" fill="none" width="600" height="480">
  <defs>
    <radialGradient id="heroCardBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </radialGradient>
    <filter id="heroDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.14" />
    </filter>
  </defs>

  <rect width="600" height="480" rx="20" fill="url(#heroCardBg)" />

  <!-- White Clog Silhouette in Background -->
  <g transform="translate(60, 40)" filter="url(#heroDrop)">
    <path d="M50 240 C40 180 60 120 120 80 C180 40 280 40 350 70 C410 100 420 150 410 200 C400 240 360 265 290 270 C190 275 80 270 50 240 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3" />
    
    <!-- Real-time Attached Charms -->
    <!-- Charm 1: Glow Alien -->
    <circle cx="160" cy="130" r="22" fill="#10B981" stroke="#059669" stroke-width="2" />
    <text x="160" y="136" font-size="16" text-anchor="middle">👽</text>
    
    <!-- Charm 2: Fire -->
    <circle cx="230" cy="115" r="20" fill="#FF5B4D" />
    <text x="230" y="121" font-size="15" text-anchor="middle">🔥</text>

    <!-- Charm 3: Sneaker -->
    <circle cx="295" cy="135" r="22" fill="#0070F3" />
    <text x="295" y="141" font-size="15" text-anchor="middle">👟</text>

    <!-- Charm 4: Boba -->
    <circle cx="180" cy="180" r="20" fill="#F556A0" />
    <text x="180" y="186" font-size="15" text-anchor="middle">🧋</text>

    <!-- Charm 5: Star -->
    <circle cx="255" cy="175" r="22" fill="#F59E0B" />
    <text x="255" y="181" font-size="16" text-anchor="middle">⭐</text>
  </g>

  <!-- Floating Micro Metric Cards -->
  <!-- Top Right Card: 12h Free 3D CAD Mockup -->
  <g transform="translate(360, 40)" filter="url(#heroDrop)">
    <rect width="200" height="74" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="34" cy="37" r="18" fill="#EBF5FF" />
    <text x="34" y="42" font-size="16" text-anchor="middle">⚡</text>
    <text x="62" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="15" fill="#0F172A">12h CAD Proof</text>
    <text x="62" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#64748B">Free Virtual 3D Mockup</text>
  </g>

  <!-- Bottom Left Card: 15kg Pull Resistance Tested -->
  <g transform="translate(40, 340)" filter="url(#heroDrop)">
    <rect width="210" height="74" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="34" cy="37" r="18" fill="#DCFCE7" />
    <text x="34" y="42" font-size="16" text-anchor="middle">🛡️</text>
    <text x="62" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="15" fill="#0F172A">&gt;15kg Pull Tested</text>
    <text x="62" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#64748B">POM Ultrasonic Rivet</text>
  </g>

  <!-- Bottom Right Card: SEDEX & BSCI Audited -->
  <g transform="translate(350, 330)" filter="url(#heroDrop)">
    <rect width="210" height="74" rx="14" fill="#0F172A" />
    <circle cx="34" cy="37" r="18" fill="#1E293B" />
    <text x="34" y="42" font-size="16" text-anchor="middle">🏅</text>
    <text x="62" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="14" fill="#FFFFFF">SMETA 4-Pillar</text>
    <text x="62" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#94A3B8">ISO 9001 &amp; BSCI Factory</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none" width="600" height="600">
  <defs>
    <radialGradient id="magBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </radialGradient>
    <filter id="magShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>
  <rect width="600" height="600" rx="24" fill="url(#magBg)" />

  <!-- Multi-layer 3D Relief Magnet Plaque -->
  <g transform="translate(110, 110)" filter="url(#magShadow)">
    <!-- Base Rubber Magnet Layer (Dark Charcoal) -->
    <rect x="0" y="0" width="380" height="260" rx="20" fill="#1E293B" stroke="#0F172A" stroke-width="4" />
    
    <!-- Top PVC Relief Panel -->
    <rect x="10" y="10" width="360" height="240" rx="16" fill="url(#skyGrad)" />
    
    <!-- Sun/Moon Glow -->
    <circle cx="290" cy="70" r="28" fill="#FDE047" opacity="0.9" />

    <!-- 3D Mountain / Architecture Layer 1 (Distant) -->
    <polygon points="20,180 80,100 160,180 240,90 320,170 370,140 370,240 20,240" fill="#0369A1" />
    
    <!-- Architecture Layer 2 (Cathedral & Towers) -->
    <rect x="70" y="120" width="40" height="110" rx="4" fill="#0C4A6E" />
    <polygon points="70,120 90,75 110,120" fill="#0C4A6E" />
    <rect x="180" y="110" width="50" height="120" rx="4" fill="#0C4A6E" />
    <rect x="250" y="130" width="35" height="100" rx="4" fill="#0C4A6E" />

    <!-- Front 3D Embossed Banner -->
    <path d="M40 205 L340 205 L325 240 L55 240 Z" fill="#FF5B4D" />
    <text x="190" y="230" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.1em">COPENHAGEN</text>
  </g>

  <!-- Built-in Stainless Steel Bottle Opener Cutout Detail -->
  <g transform="translate(390, 380)" filter="url(#magShadow)">
    <circle cx="50" cy="50" r="50" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3" />
    <path d="M30 40 L70 40 L70 48 L58 48 L58 65 L42 65 L42 48 L30 48 Z" fill="#475569" />
    <text x="50" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="9" fill="#0F172A" text-anchor="middle">OPENER</text>
  </g>

  <!-- Tag Pills -->
  <rect x="120" y="440" width="220" height="36" rx="18" fill="#10B981" filter="url(#magShadow)" />
  <text x="230" y="463" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" text-anchor="middle">NON-SCRATCH RUBBER MAGNET</text>
</svg>

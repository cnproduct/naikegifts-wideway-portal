<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none" width="600" height="600">
  <defs>
    <radialGradient id="plushBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </radialGradient>
    <filter id="plushShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.14" />
    </filter>
  </defs>
  <rect width="600" height="600" rx="24" fill="url(#plushBg)" />

  <!-- Plush Mascot Character -->
  <g transform="translate(180, 100)" filter="url(#plushShadow)">
    <!-- Ears -->
    <ellipse cx="60" cy="50" rx="25" ry="32" fill="#38BDF8" transform="rotate(-15 60 50)" />
    <ellipse cx="60" cy="50" rx="14" ry="20" fill="#F472B6" transform="rotate(-15 60 50)" />
    <ellipse cx="180" cy="50" rx="25" ry="32" fill="#38BDF8" transform="rotate(15 180 50)" />
    <ellipse cx="180" cy="50" rx="14" ry="20" fill="#F472B6" transform="rotate(15 180 50)" />

    <!-- Head (Super Soft Rounded Crystal Velvet) -->
    <ellipse cx="120" cy="115" rx="85" ry="75" fill="#38BDF8" stroke="#0284C7" stroke-width="4" />
    
    <!-- Eyes (Computerized Embroidery Stitch Texture) -->
    <ellipse cx="88" cy="105" rx="10" ry="14" fill="#0F172A" />
    <ellipse cx="152" cy="105" rx="10" ry="14" fill="#0F172A" />
    <circle cx="86" cy="100" r="4" fill="#FFFFFF" />
    <circle cx="150" cy="100" r="4" fill="#FFFFFF" />
    
    <!-- Cheeks Blush -->
    <circle cx="70" cy="122" r="10" fill="#FDA4AF" opacity="0.7" />
    <circle cx="170" cy="122" r="10" fill="#FDA4AF" opacity="0.7" />

    <!-- Nose & Smile -->
    <polygon points="120,118 114,126 126,126" fill="#F43F5E" />
    <path d="M112 130 Q120 138 128 130" stroke="#0F172A" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Body & Hoodie -->
    <ellipse cx="120" cy="230" rx="65" ry="60" fill="#0284C7" />
    <path d="M90 190 Q120 220 150 190" stroke="#FFFFFF" stroke-width="4" fill="none" />
    
    <!-- Corporate Embroidered Logo on Chest -->
    <circle cx="120" cy="235" r="18" fill="#FFFFFF" />
    <text x="120" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="12" fill="#0284C7" text-anchor="middle">TECH</text>

    <!-- Arms & Paws -->
    <ellipse cx="50" cy="220" rx="20" ry="16" fill="#38BDF8" transform="rotate(25 50 220)" />
    <ellipse cx="190" cy="220" rx="20" ry="16" fill="#38BDF8" transform="rotate(-25 190 220)" />

    <!-- Feet -->
    <ellipse cx="85" cy="290" rx="24" ry="18" fill="#38BDF8" />
    <ellipse cx="155" cy="290" rx="24" ry="18" fill="#38BDF8" />

    <!-- Woven Brand Tag with Ribbon -->
    <g transform="translate(185, 230)">
      <rect x="0" y="0" width="36" height="18" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
      <text x="18" y="12" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="800" fill="#0F172A" text-anchor="middle">NAIKE</text>
    </g>
  </g>

  <!-- Compliance Trust Pill -->
  <rect x="160" y="470" width="280" height="38" rx="19" fill="#0070F3" filter="url(#plushShadow)" />
  <text x="300" y="494" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" text-anchor="middle">EN71-1/2/3 SAFETY &#8226; RPET GRS FILLING</text>
</svg>
